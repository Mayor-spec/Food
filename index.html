<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | NourishNG</title>
    <style>
        /* --- CSS STYLES (Design Unchanged) --- */
        :root {
            --primary-green: #2ecc71;
            --dark-bg: #0f0f0f;
            --card-bg: #1a1a1a;
            --text-gray: #b3b3b3;
            --neon-glow: 0 0 10px rgba(46, 204, 113, 0.4);
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid #333;
        }

        h2 {
            margin-bottom: 10px;
            font-weight: 600;
            color: var(--primary-green);
        }

        p {
            color: var(--text-gray);
            font-size: 14px;
            margin-bottom: 30px;
        }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            color: var(--text-gray);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        input {
            width: 100%;
            padding: 12px;
            background: #252525;
            border: 1px solid #444;
            border-radius: 8px;
            color: white;
            box-sizing: border-box;
            transition: 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary-green);
            box-shadow: var(--neon-glow);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-green);
            border: none;
            border-radius: 8px;
            color: var(--dark-bg);
            font-weight: bold;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 204, 113, 0.4);
        }

        .footer-links {
            margin-top: 25px;
            font-size: 13px;
        }

        .footer-links a {
            color: var(--primary-green);
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>NourishNG</h2>
        <p>Enter your credentials to access your plan.</p>

        <div class="input-group">
            <label>Email Address</label>
            <input type="email" id="loginEmail" placeholder="tunde@example.com">
        </div>

        <div class="input-group">
            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="••••••••">
        </div>

        <button class="login-btn" onclick="loginUser()">Sign In</button>

        <div class="footer-links">
            Don't have an account? <a href="signup.html">Create one</a>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyDXKfriOdq5GS5Zhrl5hLuLXgimTInYsGE",
            authDomain: "nourishng-bd7f0.firebaseapp.com",
            projectId: "nourishng-bd7f0",
            storageBucket: "nourishng-bd7f0.firebasestorage.app",
            messagingSenderId: "942159491218",
            appId: "1:942159491218:web:fea17421d2dacae73ff64b",
            measurementId: "G-V08MGPMKV5"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.loginUser = async function() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;

            if (!email || !password) {
                alert("Please fill in all fields.");
                return;
            }

            try {
                await signInWithEmailAndPassword(auth, email, password);
                alert("Access Granted. Redirecting...");
                window.location.href = 'profile.html'; 
            } catch (error) {
                alert("Invalid email or password.");
            }
        };
    </script>
</body>
</html>
