<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile | Nourish.</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #10b981;
            --bg: #0a0a0a;
            --card-bg: #161616;
            --text-main: #ffffff;
            --text-muted: #a1a1aa;
            --border: rgba(255, 255, 255, 0.08);
            --glass: rgba(255, 255, 255, 0.03);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg); color: var(--text-main); line-height: 1.6; overflow-x: hidden; padding-bottom: 50px; }

        .navbar {
            position: sticky; top: 0; z-index: 100;
            background: rgba(10, 10, 10, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            padding: 1.2rem 1.5rem;
        }
        .nav-container {
            max-width: 1200px; margin: auto;
            display: flex; justify-content: space-between; align-items: center;
        }
        .logo { font-weight: 800; font-size: 1.4rem; letter-spacing: -1px; color: var(--primary); text-decoration: none; }
        .nav-links { display: flex; gap: 2rem; align-items: center; }
        .nav-link {
            text-decoration: none; color: var(--text-muted);
            font-size: 0.9rem; font-weight: 600; transition: 0.3s;
        }
        .nav-link:hover { color: var(--primary); }
        .nav-link.active { color: var(--primary); font-weight: 800; }

        .profile-hero {
            padding: 4rem 1.5rem 2rem;
            text-align: center;
            background: radial-gradient(circle at top, rgba(16, 185, 129, 0.05) 0%, transparent 70%);
        }
        .avatar {
            width: 110px; height: 110px;
            background: var(--card-bg);
            border-radius: 50%; margin: 0 auto 1.5rem;
            border: 2px solid var(--primary);
            display: flex; align-items: center; justify-content: center;
            font-size: 3rem; box-shadow: 0 0 30px rgba(16, 185, 129, 0.1);
        }
        h1 { font-size: 2rem; font-weight: 800; letter-spacing: -0.5px; }
        .user-tag { color: var(--text-muted); font-size: 0.85rem; font-weight: 600; margin-top: 0.5rem; }

        .container { max-width: 600px; margin: auto; padding: 1.5rem; }
        .card {
            background: var(--card-bg);
            padding: 1.8rem; border-radius: 24px;
            border: 1px solid var(--border);
            margin-bottom: 1.5rem;
        }
        .section-title { 
            font-size: 0.75rem; font-weight: 800; color: var(--primary); 
            text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 1.2rem;
            display: flex; justify-content: space-between;
        }

        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .stat-box { background: rgba(255,255,255,0.02); padding: 1.2rem; border-radius: 18px; border: 1px solid var(--border); }
        .stat-value { display: block; font-size: 1.4rem; font-weight: 800; color: #fff; margin-bottom: 4px; }
        .stat-label { font-size: 0.7rem; color: var(--text-muted); font-weight: 700; text-transform: uppercase; }

        .action-list { display: flex; flex-direction: column; gap: 0.8rem; }
        .action-item {
            display: flex; align-items: center; justify-content: space-between;
            padding: 1.2rem; background: var(--glass);
            border-radius: 16px; text-decoration: none; color: #fff;
            font-weight: 700; font-size: 0.95rem; border: 1px solid transparent;
            transition: 0.3s;
        }
        .action-item:hover { border-color: var(--primary); background: rgba(16, 185, 129, 0.05); transform: translateX(5px); }

        .logout-btn {
            width: 100%; padding: 1.2rem;
            background: rgba(220, 38, 38, 0.1); color: #ef4444;
            border: 1px solid rgba(220, 38, 38, 0.2);
            border-radius: 16px; font-weight: 800; cursor: pointer;
            margin-top: 2rem; transition: 0.3s;
        }
        .logout-btn:hover { background: #ef4444; color: #fff; }

        @media (max-width: 600px) {
            .nav-links { gap: 1rem; }
            .nav-link { font-size: 0.8rem; }
        }
    </style>
</head>
<body>

<nav class="navbar">
    <div class="nav-container">
        <a href="menu.html" class="logo">Nourish.</a>
        <div class="nav-links">
            <a href="menu.html" class="nav-link">Menu</a>
            <a href="order.html" class="nav-link">My Orders</a>
            <a href="profile.html" class="nav-link active">Profile</a>
        </div>
    </div>
</nav>

<div class="profile-hero">
    <div class="avatar">👤</div>
    <h1 id="userFullName">User Name</h1>
    <p class="user-tag">Food lover 🍽️</p>
</div>

<div class="container">
    <div class="card">
        <div class="section-title">
            <span>📊 Your Activity</span>
            <span style="opacity: 0.6;">OVERVIEW</span>
        </div>
        <div class="stats-grid">
            <div class="stat-box">
                <span class="stat-value" id="totalOrders">0</span>
                <span class="stat-label">Total Orders</span>
            </div>
            <div class="stat-box">
                <span class="stat-value">⭐</span>
                <span class="stat-label">Favorites</span>
            </div>
        </div>
    </div>

    <div class="card">
        <h3 class="section-title">🛠️ Quick Actions</h3>
        <div class="action-list">
            <a href="menu.html" class="action-item">
                <span>🍽️ Order New Meals</span>
                <span style="color: var(--primary);">→</span>
            </a>
            <a href="order.html" class="action-item">
                <span>📜 View History</span>
                <span style="color: var(--primary);">→</span>
            </a>
            <a href="settings.html" class="action-item">
                <span>⚙️ Account Settings</span>
                <span style="color: var(--primary);">→</span>
            </a>
        </div>
    </div>

    <button class="logout-btn" onclick="handleLogout()">Sign Out Account</button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const firebaseConfig = { /* Your Config Here */ };
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
        if (user) {
            const docRef = doc(db, "users", user.uid);
            const docSnap = await getDoc(docRef);

            if (docSnap.exists()) {
                const data = docSnap.data();
                document.getElementById('userFullName').innerText = data.fullName;
            }

            // Get total orders
            const q = query(collection(db, "orders"), where("userId", "==", user.uid));
            const orderSnap = await getDocs(q);

            document.getElementById('totalOrders').innerText = orderSnap.size;

        } else {
            window.location.href = 'login.html';
        }
    });

    window.handleLogout = () => signOut(auth).then(() => window.location.href = 'login.html');
</script>

</body>
</html>
